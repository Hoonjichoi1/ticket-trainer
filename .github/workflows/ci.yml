name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: ticket_trainer_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/ticket_trainer_test
      DIRECT_URL: postgresql://test:test@localhost:5432/ticket_trainer_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - run: npm install

      - run: npx prisma generate

      # migrate dev는 대화형이라 CI에선 사용 불가 → migrate deploy 사용
      - run: npx prisma migrate deploy

      - run: npm run db:seed

      - run: npx tsc --noEmit

      - run: npm run lint

      - run: npm run test
